[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "ba-tools"
version = "0.1.0"
description = "Deterministic local harness tools for BA Daily Ops"
requires-python = ">=3.11"
dependencies = [
  "click==8.4.2",
  "filelock==3.29.6",
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.15.22",
]

[project.scripts]
ba-tools = "ba_tools.__main__:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/ba_tools"]

[tool.hatch.build.targets.wheel.force-include]
"src/ba_tools/state/resources" = "ba_tools/state/resources"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
